name: Kaggle GPU tests

# GPU CI via Kaggle. CPU CI in ci.yml stays unchanged.
# Runs aimnet2, mace, pet, and uma suites in separate kernels (avoid e3nn conflicts).
#
# mode=smoke (default): pytest -m "not slow" — cheap enough for weekly cron.
# mode=full: entire tests/ suite (manual only; burns Kaggle GPU quota).
#
# UMA needs HuggingFace auth for fairchem weights. Set secrets.HF_TOKEN if the
# uma suite should download uma-s-1p2; otherwise that suite fails at weight load.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to clone and test on Kaggle
        required: false
        default: main
        type: string
      mode:
        description: >
          smoke = pytest -m "not slow" (default); full = entire tests/ suite.
          Prefer smoke unless debugging GPU regressions.
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
      marker:
        description: >
          Optional pytest marker override for all suites. Leave empty to use
          suite defaults for the selected mode.
        required: false
        default: ""
        type: string
  schedule:
    # Weekly smoke only (UTC Sunday). Full suite stays manual.
    - cron: "0 6 * * 0"

concurrency:
  group: kaggle-gpu-${{ github.workflow }}-${{ github.event.inputs.ref || github.ref }}-${{ github.event.inputs.mode || 'smoke' }}
  cancel-in-progress: true

jobs:
  kaggle-gpu:
    name: Kaggle GPU (${{ matrix.suite }}, ${{ github.event.inputs.mode || 'smoke' }}, ${{ github.event.inputs.ref || 'main' }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: aimnet2
            mlip_extra: aimnet2
          - suite: mace
            mlip_extra: mace
          - suite: pet
            mlip_extra: pet
          - suite: uma
            mlip_extra: uma
    steps:
      - name: Resolve mode and ref
        id: cfg
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_MARKER: ${{ github.event.inputs.marker }}
        run: |
          REF="${INPUT_REF:-main}"
          MODE="${INPUT_MODE:-smoke}"
          if [ -n "${INPUT_MARKER}" ]; then
            MARKER="${INPUT_MARKER}"
          elif [ "${MODE}" = "full" ]; then
            MARKER=""
          else
            MARKER="not slow"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "marker=${MARKER}" >> "$GITHUB_OUTPUT"
          echo "Resolved ref=${REF} mode=${MODE} marker=${MARKER:-<none>}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.cfg.outputs.ref }}

      - name: Render Kaggle runner script
        env:
          GIT_REF: ${{ steps.cfg.outputs.ref }}
          MLIP_EXTRA: ${{ matrix.mlip_extra }}
          PYTEST_MARKER: ${{ steps.cfg.outputs.marker }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          template = Path(".github/scripts/kaggle_gpu_runner.template.py").read_text()
          hf_token = os.environ.get("HF_TOKEN", "")
          rendered = (
              template.replace("__GIT_REF__", os.environ["GIT_REF"])
              .replace("__PYTEST_MARKER__", os.environ["PYTEST_MARKER"])
              .replace("__MLIP_EXTRA__", os.environ["MLIP_EXTRA"])
              .replace("__HF_TOKEN__", hf_token)
          )
          out = Path(".github/scripts/kaggle_gpu_runner.py")
          out.write_text(rendered)
          print(f"Wrote {out} ({len(rendered)} bytes)")
          print(f"suite={os.environ['MLIP_EXTRA']} marker={os.environ['PYTEST_MARKER']!r}")
          print(f"hf_token_set={bool(hf_token)}")
          PY

      - name: Configure Kaggle credentials
        id: kaggle_creds
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python .github/scripts/setup_kaggle_auth.py --emit-outputs

      - name: Publish CI source bundle to Kaggle dataset
        env:
          GIT_REF: ${{ steps.cfg.outputs.ref }}
        run: |
          python -m pip install --upgrade kaggle
          tar -czf /tmp/famex-src.tar.gz \
            --exclude=.git \
            --exclude=./dist \
            --exclude='**/__pycache__' \
            --exclude='**/*.pyc' \
            --exclude='./.pytest_cache' \
            --exclude='./.kaggle' \
            --exclude='**/kaggle.json' \
            --exclude='./.env' \
            .
          mkdir -p famex-dataset
          cp /tmp/famex-src.tar.gz famex-dataset/
          cat > famex-dataset/dataset-metadata.json <<'EOF'
          {
            "title": "FAMEX CI Source",
            "id": "rlaplaza/famexcisrc",
            "licenses": [{"name": "MIT"}]
          }
          EOF
          if ! kaggle datasets status rlaplaza/famexcisrc >/dev/null 2>&1; then
            kaggle datasets create -p famex-dataset
          else
            kaggle datasets version -p famex-dataset -m "CI bundle for ${GIT_REF}"
          fi
          echo "Waiting for dataset version to finish processing..."
          for attempt in $(seq 1 60); do
            status="$(kaggle datasets status rlaplaza/famexcisrc 2>&1 || true)"
            echo "[$attempt] $status"
            if echo "$status" | grep -Eqi 'complete|ready|done'; then
              break
            fi
            sleep 5
          done
          kaggle datasets files rlaplaza/famexcisrc

      - name: Run tests on Kaggle GPU
        run: |
          python -m pip install --upgrade kaggle
          # Smoke: 1h kernel cap; full: 3h (still below Kaggle session limits).
          if [ "${{ steps.cfg.outputs.mode }}" = "full" ]; then
            TIMEOUT=10800
          else
            TIMEOUT=3600
          fi
          python .github/scripts/kaggle_run_kernel.py \
            --code-file .github/scripts/kaggle_gpu_runner.py \
            --slug-suffix "${{ matrix.suite }}" \
            --machine-shape NvidiaTeslaT4 \
            --fetch-seconds 15 \
            --timeout-seconds "${TIMEOUT}"

      - name: Dump Kaggle kernel log on failure
        if: failure()
        continue-on-error: true
        run: |
          python -m pip install --upgrade kaggle
          python .github/scripts/setup_kaggle_auth.py --require-existing
          python .github/scripts/dump_kaggle_kernel_log.py "famexgpuci-${{ matrix.suite }}" /tmp/kaggle-log
